databases:
  - name: priyamfinserv-db
    databaseName: priyam_finserv
    user: priyam_user
    plan: free

services:
  - type: web
    name: priyamfinserv
    runtime: docker
    plan: free
    healthCheckPath: /
    port: 80
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: "Priyam Finserv"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: APP_URL
        value: https://priyamfinserv.onrender.com

      # Database — automatically injected by Render from the DB above
      - key: DB_CONNECTION
        value: pgsql

      - key: DATABASE_URL
        fromDatabase:
          name: priyamfinserv-db
          property: connectionString

      # Session / Cache / Queue — use database driver (no Redis needed)
      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      # Mail — Gmail SMTP
      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_ENCRYPTION
        value: tls

      - key: MAIL_USERNAME
        value: priyamfinserve@gmail.com

      - key: MAIL_PASSWORD
        sync: false    # Set this manually in the Render dashboard

      - key: MAIL_FROM_ADDRESS
        value: priyamfinserve@gmail.com

      - key: MAIL_FROM_NAME
        value: "Priyam Finserv"

      # File storage on Render disk
      - key: FILESYSTEM_DISK
        value: local
